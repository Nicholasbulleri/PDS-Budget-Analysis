        }

            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header .stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        .stat-box {
            background: rgba(255,255,255,0.2);
            padding: 15px 25px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
        }
        
        .stat-box .number {
            font-size: 2em;
            font-weight: bold;
            display: block;
        }
        
        .stat-box .label {
            font-size: 0.9em;
            opacity: 0.9;
        }
        
        .controls {
            padding: 20px 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #dee2e6;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .search-box {
            flex: 1;
            min-width: 250px;
        }
        
        .search-box input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        .search-box input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .filter-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #dee2e6;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        
        .filter-btn:hover {
            border-color: #667eea;
            background: #f0f4ff;
        }
        
        .filter-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        
        .table-container {
            overflow-x: auto;
            max-height: calc(100vh - 300px);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        thead {
            background: #f8f9fa;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        
        th {
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #495057;
            border-bottom: 2px solid #dee2e6;
            cursor: pointer;
            user-select: none;
        }
        
        th:hover {
            background: #e9ecef;
        }
        
        th.sort-asc::after {
            content: ' ▲';
            font-size: 0.8em;
        }
        
        th.sort-desc::after {
            content: ' ▼';
            font-size: 0.8em;
        }
        
        td {
            padding: 12px 15px;
            border-bottom: 1px solid #e9ecef;
        }
        
        tbody tr {
            transition: background-color 0.2s;
        }
        
        tbody tr:hover {
            background: #f8f9fa;
        }
        
        .active-yes {
            background: #d4edda;
            color: #155724;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
            display: inline-block;
        }
        
        .active-no {
            background: #f8d7da;
            color: #721c24;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9em;
            display: inline-block;
        }
        
        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 500;
        }
        
        .category-Project-Management { background: #e3f2fd; color: #1976d2; }
        .category-CRM-Sales { background: #f3e5f5; color: #7b1fa2; }
        .category-Property-Facilities { background: #e8f5e9; color: #388e3c; }
        .category-Finance-ERP { background: #fff3e0; color: #f57c00; }
        .category-Marketing { background: #fce4ec; color: #c2185b; }
        .category-Analytics-BI { background: #e0f2f1; color: #00796b; }
        .category-Other-Unknown { background: #f5f5f5; color: #616161; }
        
        .footer {
            padding: 20px 30px;
            background: #f8f9fa;
            text-align: center;
            color: #6c757d;
            font-size: 0.9em;
        }
        
        .highlight {
            background: yellow !important;
        }
    </style>

        let filteredData = [...systemsData];
        let currentFilter = 'all';
        let sortColumn = null;
        let sortDirection = 'asc';
        
        function getCategoryClass(category) {
            return 'category-' + category.replace(/\//g, '-').replace(/\s+/g, '-');
        }
        
        function renderTable() {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            
            filteredData.forEach(system => {
                const row = document.createElement('tr');
                const activeClass = system['Active Data'] === 'Yes' ? 'active-yes' : 'active-no';
                const categoryClass = getCategoryClass(system.Category);
                
                row.innerHTML = `
                    <td><strong>${system['System Name']}</strong></td>
                    <td><span class="category-badge ${categoryClass}">${system.Category}</span></td>
                    <td>${system.Purpose}</td>
                    <td>${system['Table Count']}</td>
                    <td><span class="${activeClass}">${system['Active Data']}</span></td>
                    <td>${system.Notes || ''}</td>
                `;
                tbody.appendChild(row);
            });
            
            document.getElementById('filtered-count').textContent = filteredData.length;
        }
        
        function filterData(searchTerm, filterType) {
            filteredData = systemsData.filter(system => {
                const matchesSearch = !searchTerm || 
                    system['System Name'].toLowerCase().includes(searchTerm.toLowerCase()) ||
                    system.Category.toLowerCase().includes(searchTerm.toLowerCase()) ||
                    system.Purpose.toLowerCase().includes(searchTerm.toLowerCase());
                
                const matchesFilter = filterType === 'all' ||
                    (filterType === 'active' && system['Active Data'] === 'Yes') ||
                    (filterType === 'inactive' && system['Active Data'] === 'No');
                
                return matchesSearch && matchesFilter;
            });
            
            if (sortColumn) {
                sortTable(sortColumn, sortDirection, true);
            } else {
                renderTable();
            }
        }
        
        function sortTable(column, direction, skipRender = false) {
            sortColumn = column;
            sortDirection = direction;
            
            filteredData.sort((a, b) => {
                let aVal = a[column];
                let bVal = b[column];
                
                if (column === 'tables') {
                    aVal = aVal === 'Unknown' ? 0 : parseInt(aVal) || 0;
                    bVal = bVal === 'Unknown' ? 0 : parseInt(bVal) || 0;
                } else if (column === 'active') {
                    aVal = aVal === 'Yes' ? 1 : 0;
                    bVal = bVal === 'Yes' ? 1 : 0;
                } else {
                    aVal = (aVal || '').toLowerCase();
                    bVal = (bVal || '').toLowerCase();
                }
                
                if (aVal < bVal) return direction === 'asc' ? -1 : 1;
                if (aVal > bVal) return direction === 'asc' ? 1 : -1;
                return 0;
            });
            
            if (!skipRender) {
                renderTable();
            }
            
            // Update sort indicators
            document.querySelectorAll('th').forEach(th => {
                th.classList.remove('sort-asc', 'sort-desc');
                if (th.dataset.sort === column) {
                    th.classList.add(direction === 'asc' ? 'sort-asc' : 'sort-desc');
                }
            });
        }
        
        // Event listeners
        document.getElementById('search-input').addEventListener('input', (e) => {
            filterData(e.target.value, currentFilter);
        });
        
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                filterData(document.getElementById('search-input').value, currentFilter);
            });
        });
        
        document.querySelectorAll('th[data-sort]').forEach(th => {
            th.addEventListener('click', () => {
                const column = th.dataset.sort;
                const newDirection = sortColumn === column && sortDirection === 'asc' ? 'desc' : 'asc';
                sortTable(column, newDirection);
            });
        });
        
        // Initialize
        document.querySelector('.filter-btn[data-filter="all"]').classList.add('active');
        renderTable();
    </script>
